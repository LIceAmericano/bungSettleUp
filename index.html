<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>벙 정산 계산기</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --sub:#6b7280; --line:#e5e7eb; --main:#3b6cf6; --accent:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14161b; --card:#1e2128; --text:#e8eaf0; --sub:#9aa1b0; --line:#2e323c; --main:#6c93ff; --accent:#242a3d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 12px 40px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 14px; }
  h2 { font-size:17px; margin:0 0 10px; color:var(--main); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--sub); margin-bottom:4px; }
  input[type=text], input[type=number], select { width:100%; padding:10px; font-size:16px; border:1px solid var(--line);
         border-radius:8px; background:var(--bg); color:var(--text); }
  input[readonly] { opacity:.7; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; margin-bottom:8px; }
  .row .no { color:var(--sub); font-size:13px; text-align:center; }
  .chk { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--text); margin:0; white-space:nowrap; min-width:64px; }
  .chk input { width:18px; height:18px; }
  .host-tag { font-size:13px; color:var(--main); font-weight:600; min-width:64px; text-align:center; }
  button { width:100%; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--main); color:#fff; cursor:pointer; }
  button:active { opacity:.85; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 4px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--sub); font-weight:500; font-size:12px; }
  .badge { font-size:11px; padding:2px 6px; border-radius:6px; background:var(--accent); color:var(--main); margin-left:4px; }
  .sum { font-size:14px; line-height:1.8; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .sum b { float:right; }
  .sum .t { font-weight:700; color:var(--main); }
  .detail { display:block; font-size:11px; color:var(--sub); font-weight:400; }
  .err { color:#e5484d; font-size:14px; }
  .note { font-size:12px; color:var(--sub); margin-top:8px; }
  .copy { margin-top:10px; background:var(--accent); color:var(--main); }
  footer { margin-top:28px; padding-top:16px; border-top:1px solid var(--line); text-align:center; font-size:12px; line-height:1.7; color:var(--sub); }
  footer .meta { font-weight:600; color:var(--text); margin-bottom:8px; }
  footer p { margin:0 0 8px; word-break:keep-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 벙 정산 계산기</h1>

  <div class="card">
    <div class="grid2">
      <div><label for="host">벙주 이름</label><input type="text" id="host" placeholder="벙주 이름"></div>
      <div><label for="rounds">총 몇 차까지 갔나요?</label>
        <select id="rounds"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    </div>
    <label for="mode" style="margin-top:12px">벙주 혜택 적용</label>
    <select id="mode"><option value="every">차수마다 적용 (각 차수 인원 기준)</option><option value="first">1차에만 적용</option><option value="none">적용 안 함 (혜택 없이 1/N 정산)</option></select>
  </div>

  <div id="roundsBox"></div>
  <button id="go">정산하기</button>
  <div class="card" id="result" style="margin-top:14px; display:none;"></div>

  <footer>
    <div class="meta">벙 정산 계산기 v1.1 · Made by 얼죽아</div>
    <p>⚠️ 이 계산기는 참고용 도구입니다. 계산 결과를 그대로 믿지 마시고, 송금 전에 금액을 한 번 더 확인해 주세요. 계산기 사용으로 생긴 금액 차이에 대해서는 제작자가 책임지지 않습니다.</p>
    <p>🛠 사용 중 버그를 발견하셨거나 추가되었으면 하는 기능이 있다면 모임카톡방 '얼죽아'에게 문의해 주세요. 확인 후 반영해 보겠습니다.</p>
    <p>모두 재미있고 즐거운 모임 되세요! 🎉</p>
  </footer>
</div>

<script>
const DEPOSIT = 50000;
const $ = s => document.querySelector(s);
const won = v => v.toLocaleString("ko-KR") + "원";
const num = s => parseInt(String(s).replace(/[^0-9]/g, ""), 10) || 0;
const hostName = () => $("#host").value.trim() || "벙주";
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function benefitByHeadcount(n) {
  if (n >= 22) return 20000;   // 22명 이상 20,000원 고정
  if (n >= 11) return 10000;
  if (n >= 6) return 5000;
  return 0;
}

const box = $("#roundsBox");

function readPeople(card) {
  return [...card.querySelectorAll(".row")].map((r, i) => ({
    name: r.querySelector("input[type=text]").value,
    newbie: i > 0 && r.querySelector("input[type=checkbox]").checked
  }));
}
// 2차 이후: 이전 차수에 이미 있던 사람은 신입 체크박스를 숨김
function refreshNewbie() {
  const known = new Set([hostName()]);
  box.querySelectorAll(".round").forEach((card, i) => {
    const rows = [...card.querySelectorAll(".row")].slice(1);
    const names = [];
    rows.forEach(r => {
      const nm = r.querySelector("input[type=text]").value.trim();
      const lab = r.querySelector(".chk");
      const hide = i > 0 && nm !== "" && known.has(nm);
      if (hide) lab.querySelector("input").checked = false;
      lab.style.display = hide ? "none" : "";
      if (nm) names.push(nm);
    });
    names.forEach(n => known.add(n));
  });
}
function readCard(card) {
  return { total: card.querySelector(".r-total").value, count: card.querySelector(".r-count").value, people: readPeople(card) };
}

function renderNames(card, prev) {
  let n = parseInt(card.querySelector(".r-count").value, 10);
  n = isNaN(n) || n < 2 ? 2 : Math.min(n, 100);
  const el = card.querySelector(".names");
  el.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const row = document.createElement("div");
    row.className = "row";
    const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
    const input = document.createElement("input"); input.type = "text";
    row.append(no, input);
    if (i === 0) {
      input.className = "host-name"; input.readOnly = true; input.value = hostName();
      const tag = document.createElement("span"); tag.className = "host-tag"; tag.textContent = "벙주";
      row.append(tag);
    } else {
      input.placeholder = "이름"; input.value = prev[i] ? prev[i].name : "";
      const lab = document.createElement("label"); lab.className = "chk";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = prev[i] ? prev[i].newbie : false;
      lab.append(cb, document.createTextNode("신입"));
      row.append(lab);
    }
    el.append(row);
  }
}

function buildRound(i, prev) {
  const card = document.createElement("div");
  card.className = "card round";
  card.innerHTML = `<h2>${i + 1}차</h2><div class="grid2">
    <div><label>금액 (원)</label><input type="text" class="r-total" inputmode="numeric" placeholder="예: 120000"></div>
    <div><label>참석 인원 (벙주 포함)</label><input type="number" class="r-count" min="2" max="100"></div></div>
    <label style="margin-top:12px">참석자 (1번은 벙주 / 신입은 체크)</label><div class="names"></div>`;
  card.querySelector(".r-total").value = prev && prev.keepTotal ? prev.total : "";
  card.querySelector(".r-count").value = prev ? prev.count : 6;
  renderNames(card, prev ? prev.people : []);
  return card;
}

function renderRounds() {
  const k = parseInt($("#rounds").value, 10);
  const prev = [...box.querySelectorAll(".round")].map(readCard);
  prev.forEach(p => p.keepTotal = true);
  box.innerHTML = "";
  for (let i = 0; i < k; i++) {
    let p = prev[i];
    if (!p && prev.length) { p = { ...prev[prev.length - 1], keepTotal: false }; }  // 새 차수는 직전 차수의 인원/명단을 복사
    box.append(buildRound(i, p));
  }
  refreshNewbie();
}

$("#rounds").addEventListener("change", renderRounds);
$("#host").addEventListener("input", () => { box.querySelectorAll(".host-name").forEach(e => e.value = hostName()); refreshNewbie(); });
box.addEventListener("input", e => {
  const card = e.target.closest(".round");
  if (e.target.classList.contains("r-total")) {
    const d = num(e.target.value); e.target.value = d ? d.toLocaleString("ko-KR") : "";
  } else if (e.target.classList.contains("r-count")) {
    renderNames(card, readPeople(card));
  }
  refreshNewbie();
});
renderRounds();

// 한 차수 계산 (소수점 버림, 남는 금액은 벙주 부담)
function calcRound(total, n, allowBenefit) {
  const per = Math.floor(total / n);
  const maxB = allowBenefit ? benefitByHeadcount(n) : 0;
  const applied = Math.min(maxB, per);
  const hostBase = per - applied;
  const remain = total - hostBase;
  const others = Math.floor(remain / (n - 1));
  const leftover = remain - others * (n - 1);
  return { total, n, per, maxB, applied, excess: maxB - applied, remain, others, leftover, hostPay: hostBase + leftover };
}

$("#go").addEventListener("click", () => {
  const out = $("#result");
  out.style.display = "block";
  const fail = m => { out.innerHTML = `<div class="err">${m}</div>`; };

  const host = hostName();
  const cards = [...box.querySelectorAll(".round")];
  const mode = $("#mode").value;
  const rounds = [];
  const people = new Map();   // 이름 -> {host, newbie, pays: {차수index: 금액}}
  const get = (name, isHost) => { if (!people.has(name)) people.set(name, { name, host: isHost, newbie: false, pays: {} }); return people.get(name); };
  get(host, true);

  for (let i = 0; i < cards.length; i++) {
    const total = num(cards[i].querySelector(".r-total").value);
    const list = readPeople(cards[i]);
    const n = list.length;
    if (!total) return fail(`${i + 1}차 금액을 입력해주세요.`);
    const seen = new Set([host]);
    for (let j = 1; j < n; j++) {
      const nm = list[j].name.trim();
      if (!nm) return fail(`${i + 1}차 ${j + 1}번 참석자 이름을 입력해주세요.`);
      if (seen.has(nm)) return fail(`${i + 1}차에 "${esc(nm)}" 이름이 중복됐어요. (벙주와 같은 이름도 안 돼요)`);
      seen.add(nm);
    }
    const r = calcRound(total, n, mode === "every" || (mode === "first" && i === 0));
    rounds.push(r);
    get(host, true).pays[i] = r.hostPay;
    for (let j = 1; j < n; j++) {
      const p = get(list[j].name.trim(), false);
      p.pays[i] = r.others;
      if (list[j].newbie) p.newbie = true;
    }
  }

  const K = rounds.length;
  const grand = rounds.reduce((a, r) => a + r.total, 0);
  const sumOf = p => Object.values(p.pays).reduce((a, b) => a + b, 0);
  const brk = p => Object.keys(p.pays).map(i => `${+i + 1}차 ${p.pays[i].toLocaleString("ko-KR")}`).join(" + ");

  // 차수별 요약
  const lines = r => {
    const l = [["금액 / 인원", `${won(r.total)} / ${r.n}명`], [`원래 1인당 금액`, won(r.per)], ["벙주 혜택 (규정)", won(r.maxB)], ["실제 적용 혜택", won(r.applied)]];
    if (r.excess > 0) l.push(["초과 혜택 (적용 안 함)", won(r.excess)]);
    l.push([`나머지 ${r.n - 1}명이 나눌 금액`, won(r.remain)], ["나머지 1인당", won(r.others)]);
    return l;
  };

  let html = "", text = `[벙 정산] 총 ${won(grand)}${K > 1 ? ` (${K}차)` : ""}\n`;
  rounds.forEach((r, i) => {
    const l = lines(r);
    html += `<div class="sum"><div class="t">${i + 1}차</div>` + l.map(x => `<div>${x[0]}<b>${x[1]}</b></div>`).join("") + "</div>";
    text += `\n[${i + 1}차]\n` + l.map(x => `${x[0]}: ${x[1]}`).join("\n") + "\n";
  });
  text += "\n";

  html += `<table><thead><tr><th>이름</th><th>${K > 1 ? "합계" : "낼 금액"}</th><th>선입금</th><th>벙주 환급</th></tr></thead><tbody>`;
  let newbieCnt = 0;
  people.forEach(p => {
    const pay = sumOf(p);
    let dep = "-", ref = "-", refText = "";
    if (p.newbie) {
      newbieCnt++;
      const diff = DEPOSIT - pay;
      dep = won(DEPOSIT);
      ref = diff >= 0 ? won(diff) : "추가 " + won(-diff);
      refText = diff >= 0 ? ` (선입금 ${won(DEPOSIT)} → ${won(diff)} 환급)` : ` (선입금 ${won(DEPOSIT)} → ${won(-diff)} 추가 입금)`;
    }
    const tag = p.host ? '<span class="badge">벙주</span>' : (p.newbie ? '<span class="badge">신입</span>' : "");
    html += `<tr><td>${esc(p.name)}${tag}${K > 1 ? `<span class="detail">${brk(p)}</span>` : ""}</td><td><b>${won(pay)}</b></td><td>${dep}</td><td>${ref}</td></tr>`;
    text += `${p.name}${p.host ? "(벙주)" : p.newbie ? "(신입)" : ""}: ${won(pay)}${K > 1 ? ` [${brk(p)}]` : ""}${refText}\n`;
  });
  html += "</tbody></table>";

  const lo = rounds.map((r, i) => r.leftover > 0 ? `${i + 1}차 ${won(r.leftover)}` : "").filter(Boolean);
  if (lo.length) {
    const m = `나누어떨어지지 않아 남은 금액(${lo.join(", ")})은 벙주 부담금에 포함했어요.`;
    html += `<div class="note">${m}</div>`; text += `\n※ ${m}`;
  }
  if (newbieCnt) html += `<div class="note">신입 ${newbieCnt}명은 선입금 ${won(DEPOSIT)}에서 전체 차수 합계를 뺀 만큼 벙주가 환급해요.</div>`;
  if (mode === "first" && K > 1) html += `<div class="note">벙주 혜택은 1차에만 적용했어요.</div>`;
  if (mode === "none") html += `<div class="note">벙주 혜택 없이 전원 1/N로 정산했어요.</div>`;
  html += '<button class="copy" id="copyBtn">결과 복사하기</button>';

  out.innerHTML = html;
  $("#copyBtn").addEventListener("click", async e => {
    const btn = e.target, t = text.trim();
    if (await copyText(t)) { btn.textContent = "복사됐어요 ✓"; return; }
    btn.textContent = "자동 복사가 막혀 있어요 - 아래 글을 직접 복사해주세요";
    if (!$("#manualCopy")) {
      const ta = document.createElement("textarea");
      ta.id = "manualCopy"; ta.readOnly = true; ta.value = t; ta.rows = Math.min(24, t.split("\n").length + 1);
      ta.style.cssText = "width:100%;margin-top:10px;padding:10px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);";
      ta.addEventListener("focus", () => ta.select());
      btn.after(ta);
    }
    $("#manualCopy").focus();
  });
});

async function copyText(t) {
  try {   // 1) 구형 방식 (사용자 클릭 직후라 대부분 브라우저에서 동작)
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.append(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    if (ok) return true;
  } catch (_) {}
  try { await navigator.clipboard.writeText(t); return true; } catch (_) {}   // 2) 최신 방식
  return false;
}
</script>
</body>
</html>
